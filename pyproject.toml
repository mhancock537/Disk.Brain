[project]
name = "diskbrain"
version = "0.1.0"
description = "Disk.Brain: local semantic search over your own documents, with an OKF knowledge bundle as the artifact of record"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mike Hancock" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "blake3==1.0.9",
    "pymupdf==1.28.2",
    "markitdown[docx,pptx,xlsx,xls,outlook]==0.1.7",
    "ocrmac==1.0.1",
    "mcp==2.0.0",
    "mlx-lm==0.31.3",
    "lancedb==0.36.0",
    "ladybug==0.19.1",
    "ollama==0.6.2",
    "pyyaml==6.0.3",
    "watchdog==6.0.0",
    "typer==0.27.1",
    "rich==15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
kb = "kb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: spawns a subprocess or loads a model"]
